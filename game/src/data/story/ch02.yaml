# 第 2 章（Case 03）的對話。每一句都是中英並排，speaker 對應語系檔的 speaker.*。
intro:
  - speaker: sys
    zh: "【02:47】手機震動。SPC：N9K417.1 AEI CD 47.4 nm 超出 UCL，已自動 Hold。"
    en: "[02:47] Your phone buzzes. SPC: N9K417.1 AEI CD 47.4 nm, above UCL. Auto-held."
  - speaker: me
    zh: "……又是 ETCH 段。先回座位上的 PE 工作站看看。"
    en: "…ETCH again. Let me check the PE workstation at my desk first."
  - speaker: sys
    zh: "方向鍵／WASD 走路，點地板會自動走過去。靠近東西按 E 或空白鍵互動。"
    en: "Arrow keys or WASD to walk, or click the floor to walk there. Press E or Space next to something to interact."

boss_solved:
  - speaker: boss
    zh: "辛苦了。8 點我來報，你去吃早餐吧。"
    en: "Good work. I'll present it at 8. Go get some breakfast."
boss_suit:
  - speaker: boss
    zh: "你穿兔寶寶裝跑來辦公室幹嘛……算了。"
    en: "Why are you wearing the bunny suit in the office… never mind."
boss_main:
  - speaker: boss
    zh: "CD 那批到底能不能放？8 點要報。"
    en: "Can we release that CD lot or not? I'm presenting at 8."
boss_ready:
  - speaker: boss
    zh: "證據看起來夠了，回 PE 工作站把結論填一填。"
    en: "Looks like you have enough evidence. Go fill in the conclusion at the PE workstation."
boss_more:
  - speaker: boss
    zh: "去 Fab 看看 ETCH-07。記得帶證據回來，不要跟我說「感覺」。"
    en: "Go look at ETCH-07 in the fab. Bring back evidence. Don't tell me it's a “feeling.”"

kevin:
  - speaker: kevin
    zh: "喔，你也被 call 來了。"
    en: "Oh, they called you in too."
  - speaker: kevin
    zh: "PM-B 從前天就怪怪的，RF 反射功率一直往上爬。"
    en: "PM-B has been acting weird since the day before yesterday. RF reflected power keeps creeping up."
  - speaker: kevin
    zh: "偷偷跟你說，PM-B 的 PM 上禮拜被延了，生管說產能要顧。你懂的。"
    en: "Between us, PM-B's maintenance got pushed back last week. Production control said throughput comes first. You know how it is."
  - speaker: kevin
    zh: "機台畫面有「耗材」頁，可以看 focus ring 用了幾小時。"
    en: "The tool screen has a Consumables tab. It shows how many hours the focus ring has run."

fse:
  - speaker: fse
    zh: "我是原廠的阿哲。CVD-11 今天很乖。"
    en: "I'm A-Zhe from the OEM. CVD-11 is behaving today."
  - speaker: fse
    zh: "ETCH-07？原廠 part 要等三週喔～"
    en: "ETCH-07? OEM parts take three weeks~"
  - speaker: fse
    zh: "不過 focus ring 你們倉庫應該有庫存啦。"
    en: "Your warehouse should have focus rings in stock, though."

say_desk2:
  - speaker: me
    zh: "桌上有三杯沒喝完的咖啡，還有一張寫著「PM-B ??」的便利貼。"
    en: "Three half-finished coffees on the desk, and a sticky note that says “PM-B ??”."
say_desk3:
  - speaker: me
    zh: "螢幕保護程式在跑：「良率就是生命」。"
    en: "The screensaver reads: “Yield is life.”"
say_desk4:
  - speaker: me
    zh: "抽屜裡有一包沒拆的泡麵。值班人的好朋友。"
    en: "An unopened pack of instant noodles in the drawer. The night shift's best friend."
say_bossdesk:
  - speaker: me
    zh: "桌上放著 8 點晨會的簡報，標題是「ETCH CD 異常說明」……內容還是空的。"
    en: "The slides for the 8 a.m. stand-up sit on the desk, titled “ETCH CD Excursion Explained”… They're still blank."

locker_on:
  - speaker: me
    zh: "頭套、口罩、連身衣、兩層手套、無塵鞋……鏡子裡出現一隻兔寶寶。"
    en: "Hood, mask, coverall, two pairs of gloves, cleanroom boots… A bunny stares back from the mirror."
  - speaker: sys
    zh: "往東走過風淋室就是 Fab。"
    en: "Head east through the air shower to reach the fab."

coffee_ok:
  - speaker: me
    zh: "公司咖啡：免費，但很苦。咖啡 +1。"
    en: "Company coffee: free, and very bitter. Coffee +1."
coffee_full:
  - speaker: me
    zh: "已經第五杯了，手在抖。先不要。"
    en: "That's the fifth cup. Your hands are shaking. Maybe not."

rc_wrong:
  - speaker: boss
    zh: "EE 照你的結論處理了，CD 還是沒回來。再查查看？（咖啡 −1）"
    en: "EE did what your conclusion said, and the CD still hasn't come back. Look again? (Coffee −1)"

rc_solved:
  - speaker: sys
    zh: "EE 換上新的 focus ring，PM-B 跑 monitor wafer：CD 45.1 nm，回到 target。"
    en: "EE installed a new focus ring. PM-B ran a monitor wafer: CD 45.1 nm, back on target."
  - speaker: sys
    zh: "Hold 的 4 批 lot 重新量測後放行。"
    en: "The 4 held lots were re-measured and released."
  - speaker: boss
    zh: "好，8 點我來報。你去吃早餐吧。"
    en: "Fine. I'll present it at 8. Go get some breakfast."
  - speaker: sys
    zh: "CASE 03 完成！用到線索 {n}/5，剩下咖啡 {c} 杯。"
    en: "CASE 03 complete! Clues used: {n}/5. Coffee left: {c}."
