# 第 2 章（Case 03）的劇情。每段劇情是一串段落（beat），台詞中英並排；speaker 對應語系檔的 speaker.*。
triggers:
  # C2-08：過場之後走進會議室（含門口）就開晨會。
  - { scene: c2_standup, map: M03, at: [3, 11, 11, 6], if: { chapter: ch2, flag: c2_standup_call, notFlag: seen_c2_standup } }

scenes:
  intro:
    - effect: { flag: ev_unlocked }
    - line:
        id: intro-1
        speaker: sys
        zh: "【02:47】手機震動。SPC：N9K417.1 AEI CD 47.4 nm 超出 UCL，已自動 Hold。"
        en: "[02:47] Your phone buzzes. SPC: N9K417.1 AEI CD 47.4 nm, above UCL. Auto-held."
    - line:
        id: intro-2
        speaker: me
        zh: "……又是 ETCH 段。先回座位上的 PE 工作站看看。"
        en: "…ETCH again. Let me check the PE workstation at my desk first."
    - line:
        id: intro-3
        speaker: sys
        zh: "方向鍵／WASD 走路，點地板會自動走過去。靠近東西按 E 或空白鍵互動。"
        en: "Arrow keys or WASD to walk, or click the floor to walk there. Press E or Space next to something to interact."

  # 王經理：依狀態組合台詞。
  boss:
    - if: { solved: true }
      then:
        - include: boss_solved
      else:
        - if: { suit: true }
          then:
            - include: boss_suit
        - include: boss_main
        - if: { clues: 3 }
          then:
            - include: boss_ready
          else:
            - include: boss_more
  boss_solved:
    - line: { id: boss_solved-1, speaker: boss, zh: "辛苦了。8 點晨會我來報，你也一起進來。陳處長會在。", en: "Good work. I'll present it at the 8 o'clock stand-up. You come in too. Director Chen will be there." }
  boss_suit:
    - line: { id: boss_suit-1, speaker: boss, zh: "你穿兔寶寶裝跑來辦公室幹嘛……算了。", en: "Why are you wearing the bunny suit in the office… never mind." }
  boss_main:
    - line: { id: boss_main-1, speaker: boss, zh: "CD 那批到底能不能放？8 點要報。", en: "Can we release that CD lot or not? I'm presenting at 8." }
  boss_ready:
    - line: { id: boss_ready-1, speaker: boss, zh: "證據看起來夠了，回 PE 工作站把結論填一填。", en: "Looks like you have enough evidence. Go fill in the conclusion at the PE workstation." }
  boss_more:
    - line: { id: boss_more-1, speaker: boss, zh: "去 Fab 看看 ETCH-07。記得帶證據回來，不要跟我說「感覺」。", en: "Go look at ETCH-07 in the fab. Bring back evidence. Don't tell me it's a “feeling.”" }

  kevin:
    - if: { solved: true }
      then:
        - line: { id: kevin-solved-1, speaker: kevin, zh: "聽說是 focus ring？做得好。大熊在 seasoning 了。", en: "Focus ring, huh? Nice work. Bear's seasoning the chamber now." }
      else:
        - line: { id: kevin-1, speaker: kevin, zh: "喔，你也被 call 來了。", en: "Oh, they called you in too." }
        - line: { id: kevin-2, speaker: kevin, zh: "PM-B 從前天就怪怪的，RF 反射功率一直往上爬。", en: "PM-B has been acting weird since the day before yesterday. RF reflected power keeps creeping up." }
        - line: { id: kevin-3, speaker: kevin, zh: "偷偷跟你說，PM-B 的 PM 上禮拜被延了，生管說產能要顧。你懂的。", en: "Between us, PM-B's maintenance got pushed back last week. Production control said throughput comes first. You know how it is." }
        - line: { id: kevin-4, speaker: kevin, zh: "機台畫面有「耗材」頁，可以看 focus ring 用了幾小時。", en: "The tool screen has a Consumables tab. It shows how many hours the focus ring has run." }
        - effect: { clue: pm }
    # 找盟友聊天：每章一次，理智 +5。
    - if: { notFlag: chat_kevin_ch2 }
      then:
        - effect: { sanity: 5, flag: chat_kevin_ch2 }
        - line: { id: kevin-chat, speaker: sys, zh: "（跟 Kevin 學長抱怨了兩句夜班，心情好一點。理智 +5）", en: "(You grumble about the night shift with Kevin for a bit and feel a little better. Sanity +5)" }

  fse:
    - line: { id: fse-1, speaker: fse, zh: "我是原廠的阿哲。CVD-11 今天很乖。", en: "I'm A-Zhe from the OEM. CVD-11 is behaving today." }
    - line: { id: fse-2, speaker: fse, zh: "ETCH-07？原廠 part 要等三週喔～", en: "ETCH-07? OEM parts take three weeks~" }
    - line: { id: fse-3, speaker: fse, zh: "不過 focus ring 你們倉庫應該有庫存啦。", en: "Your warehouse should have focus rings in stock, though." }
    - if: { notFlag: chat_fse_ch2 }
      then:
        - effect: { sanity: 5, flag: chat_fse_ch2 }
        - line: { id: fse-chat, speaker: sys, zh: "（阿哲講了一個原廠的八卦，你笑了出來。理智 +5）", en: "(A-Zhe shares some OEM gossip and you laugh out loud. Sanity +5)" }

  # 序章接第 2 章（C2-01）：章節卡、換到夜班、回到辦公室。
  ch2_start:
    - card: { kind: chapter, zh: "第 2 章 · Case 03 之夜｜兩個月後", en: "Chapter 2 · The Night of Case 03 | Two months later" }
    - effect: { chapter: ch2, time: "02:47", etch: alarm, warp: { map: M03, x: 3, y: 4, dir: up } }
    - include: intro

  say_desk2:
    - if: { chapter: prologue }
      then:
        - line: { id: say_desk2-p1, speaker: me, zh: "Kevin 學長的桌上堆滿報告，最上面那份是〈ETCH 段月報 v7〉。", en: "Kevin's desk is buried in reports. The one on top says “ETCH monthly report v7”." }
        - goto: say_end
    - line: { id: say_desk2-1, speaker: me, zh: "桌上有三杯沒喝完的咖啡，還有一張寫著「PM-B ??」的便利貼。", en: "Three half-finished coffees on the desk, and a sticky note that says “PM-B ??”." }
  say_desk3:
    - line: { id: say_desk3-1, speaker: me, zh: "螢幕保護程式在跑：「良率就是生命」。", en: "The screensaver reads: “Yield is life.”" }
  say_desk4:
    - line: { id: say_desk4-1, speaker: me, zh: "抽屜裡有一包沒拆的泡麵。值班人的好朋友。", en: "An unopened pack of instant noodles in the drawer. The night shift's best friend." }
  say_bossdesk:
    - if: { chapter: prologue }
      then:
        - line: { id: say_bossdesk-p1, speaker: me, zh: "桌上貼著一張便條：「8/24 新人報到」，旁邊畫了一個問號。", en: "A note on the desk: “8/24 new hire starts”, with a question mark drawn next to it." }
        - goto: say_end
    - line: { id: say_bossdesk-1, speaker: me, zh: "桌上放著 8 點晨會的簡報，標題是「ETCH CD 異常說明」……內容還是空的。", en: "The slides for the 8 a.m. stand-up sit on the desk, titled “ETCH CD Excursion Explained”… They're still blank." }

  # C2-08：08:00 晨會，王經理搶功、煤氣燈；C2-09：三選一。
  c2_standup:
    - effect: { time: "08:00", flag: seen_c2_standup }
    - effect: { flag: c2_in_standup, suit: false, warp: { map: M03, x: 8, y: 15, dir: up } }
    - line: { id: c2_standup-1, speaker: sys, zh: "08:00，晨會。陳處長坐在白板前，王經理的簡報已經投上去了。", en: "08:00. The stand-up. Director Chen sits by the whiteboard. Manager Wang's slides are already up." }
    - line: { id: c2_standup-2, speaker: chen, zh: "我不要過程，我要結果。ETCH 那批怎麼樣了？", en: "I don't want the process. I want results. What happened with the ETCH lots?" }
    - line: { id: c2_standup-3, speaker: boss, zh: "我判斷是 focus ring 的問題，已經處理了。", en: "I identified it as a focus ring issue, and it's been handled.", tactic: credit_stealing, sanity: -12, evidence: meeting }
    - line: { id: c2_standup-4, speaker: me, zh: "呃……那個 focus ring，是我凌晨四點半查到的……", en: "Um… I was the one who found the focus ring, around 4:30 this morning…" }
    - line: { id: c2_standup-5, speaker: boss, zh: "我昨天不是就叫你去看 focus ring 了嗎？你記錯了吧。", en: "Didn't I tell you to check the focus ring yesterday? You must be remembering it wrong.", tactic: gaslighting, sanity: -12, evidence: meeting }
    - line: { id: c2_standup-6, speaker: sys, zh: "陳處長看了你一眼，又看了王經理一眼。", en: "Director Chen glances at you, then at Manager Wang." }
    - choice:
        - id: line
          zh: "當場拿出手機，給處長看 LINE 紀錄（需要你 04:32 的回報和他的回覆）"
          en: "Pull up the LINE messages right there (needs your 04:32 report and his reply)"
          if: { evidence: [E-C2-03, E-C2-04] }
          do:
            - line: { id: c2_standup-l1, speaker: me, zh: "處長，這是凌晨的 LINE。04:32 我回報 focus ring 1,180 小時、建議更換；05:10 經理回了一個「嗯」。", en: "Director, these are the LINE messages from last night. At 04:32 I reported the focus ring at 1,180 hours and recommended replacing it. At 05:10 the manager replied, “Mm.”" }
            - line: { id: c2_standup-l2, speaker: sys, zh: "陳處長盯著時間戳看了很久。會議室安靜到聽得見投影機的風扇。", en: "Director Chen studies the timestamps for a long time. The room goes so quiet you can hear the projector fan." }
            - line: { id: c2_standup-l3, speaker: chen, zh: "……王經理，會後來我辦公室一下。", en: "…Manager Wang, come by my office after this." }
            - effect: { sanity: 10, rel: { boss: -25 }, flag: confronted_publicly }
            - line: { id: c2_standup-l4, speaker: sys, zh: "你的手在發抖，但你沒有退。（理智 +10）", en: "Your hands are shaking, but you don't back down. (Sanity +10)" }
        - id: email
          zh: "會後寄 email 整理時間線，CC 自己"
          en: "Email a timeline after the meeting, CC yourself"
          do:
            - if: { evidenceMin: { ids: [E-C2-01, E-C2-02, E-C2-03, E-C2-04], n: 2 } }
              then:
                - line: { id: c2_standup-e1, speaker: sys, zh: "會後，你寄出一封 email：〈Case 03 處理時間線〉，列出凌晨每一則 LINE 的時間。收件人王經理，CC 你自己。", en: "After the meeting you send an email titled “Case 03 timeline”, listing the time of every LINE message from last night. To: Manager Wang. CC: yourself." }
                - effect: { sanity: 8, rel: { boss: -5 }, flag: paper_trail }
                - line: { id: c2_standup-e2, speaker: sys, zh: "語氣很平靜，沒有一個形容詞。紀錄在那裡，就夠了。（理智 +8）", en: "It's calm, without a single adjective. The record is there, and that's enough. (Sanity +8)" }
              else:
                - line: { id: c2_standup-e3, speaker: sys, zh: "會後，你想寄一封時間線 email，但手上幾乎沒有紀錄，只能寫「凌晨我有在查」。", en: "After the meeting you try to write a timeline email, but you have almost nothing on record. All you can write is “I was investigating overnight.”" }
                - effect: { rel: { boss: -5 }, flag: paper_trail_thin }
                - line: { id: c2_standup-e4, speaker: sys, zh: "信寄出去了，但沒什麼份量。", en: "The email goes out, but it doesn't carry much weight." }
        - id: drop
          zh: "算了"
          en: "Let it go"
          do:
            - line: { id: c2_standup-d1, speaker: me, zh: "……是，可能是我記錯了。", en: "…Right. Maybe I remembered it wrong." }
            - effect: { sanity: -5, rel: { boss: 5 }, flag: let_it_go }
            - line: { id: c2_standup-d2, speaker: sys, zh: "王經理點點頭，翻到下一頁。（理智 −5）", en: "Manager Wang nods and moves on to the next slide. (Sanity −5)" }
    - effect: { unflag: c2_in_standup }
    - goto: c2_s10

  # C2-10：08:30 辦公室，依選擇和 Kevin 或芳姐對話；完成第 2 章，理智 +10；試玩結束卡。
  c2_s10:
    - effect: { time: "08:30", flag: c2_after, warp: { map: M03, x: 3, y: 4, dir: up } }
    - line: { id: c2_s10-1, speaker: sys, zh: "08:30，辦公室。夜班的人陸續下班了。", en: "08:30. The office. The night shift is heading home." }
    - if: { flag: confronted_publicly }
      then:
        - line: { id: c2_s10-k1, speaker: kevin, zh: "（小聲）你剛剛很有種。", en: "(quietly) That took guts back there." }
        - line: { id: c2_s10-k2, speaker: kevin, zh: "不過他會記得的。接下來小心一點。", en: "But he'll remember it. Watch your back for a while." }
      else:
        - if: { flag: let_it_go }
          then:
            - line: { id: c2_s10-k3, speaker: kevin, zh: "……我第一年也被這樣過。", en: "…He did the same thing to me my first year." }
            - line: { id: c2_s10-k4, speaker: kevin, zh: "你不講，下次還會發生。我是說真的。", en: "If you don't say anything, it'll happen again. I mean it." }
          else:
            - if: { flag: paper_trail }
              then:
                - line: { id: c2_s10-f1, speaker: fang, zh: "我看到你那封信了。時間、內容、誰說了什麼，都在上面。", en: "I saw your email. Times, what happened, who said what. It's all there." }
                - line: { id: c2_s10-f2, speaker: fang, zh: "在這裡，書面紀錄會保護你。記住這個感覺。", en: "Around here, written records protect you. Remember how this feels." }
              else:
                - line: { id: c2_s10-f3, speaker: fang, zh: "我看到你那封信了。有點薄喔。", en: "I saw your email. It's a bit thin." }
                - line: { id: c2_s10-f4, speaker: fang, zh: "下次查到東西，當下就傳出去。紀錄要先存在，才幫得了你。", en: "Next time you find something, send it right away. A record can only help you if it exists." }
    - line: { id: c2_s10-2, speaker: sys, zh: "你收拾東西準備下班。外面，天已經亮了。", en: "You pack up to go home. Outside, it's already light." }
    - effect: { sanity: 10 }
    - line: { id: c2_s10-3, speaker: sys, zh: "第 2 章完成。（理智 +10）", en: "Chapter 2 complete. (Sanity +10)" }
    - effect: { flag: demo_done }
    - goto: c2_demo_end

  # 試玩結束卡：第 2 章結尾、試玩結束後再按「繼續」都播這段。
  c2_demo_end:
    - card: { kind: end, zh: "第 3 章 · 互踢皮球｜11 月，一場 particle 異常。大熊說是你們製程的問題，你說是他的機台。王經理對你們兩個說的，好像不太一樣。", en: "Chapter 3 · The Blame Game | November. A particle excursion. Bear says it's your process; you say it's his tool. And Manager Wang seems to be telling each of you something different." }

  # 查看物件時用來提早結束的空劇情。
  say_end: []

  locker_on:
    - line: { id: locker_on-1, speaker: me, zh: "頭套、口罩、連身衣、兩層手套、無塵鞋……鏡子裡出現一隻兔寶寶。", en: "Hood, mask, coverall, two pairs of gloves, cleanroom boots… A bunny stares back from the mirror." }
    - line: { id: locker_on-2, speaker: sys, zh: "往東走過風淋室就是 Fab。", en: "Head east through the air shower to reach the fab." }

  coffee_ok:
    - line: { id: coffee_ok-1, speaker: me, zh: "公司咖啡：免費，但很苦。咖啡 +1。", en: "Company coffee: free, and very bitter. Coffee +1." }
  coffee_full:
    - line: { id: coffee_full-1, speaker: me, zh: "已經第五杯了，手在抖。先不要。", en: "That's the fifth cup. Your hands are shaking. Maybe not." }

  rc_wrong:
    - effect: { sanity: -5 }
    - line: { id: rc_wrong-1, speaker: boss, zh: "EE 照你的結論處理了，CD 還是沒回來。再查查看？（咖啡 −1）", en: "EE did what your conclusion said, and the CD still hasn't come back. Look again? (Coffee −1)" }
  # C2-07：送出正確結論 → 過場：大熊換 focus ring（理智 +5、大熊 +10），接著回辦公室。
  rc_solved:
    - line: { id: rc_solved-1, speaker: sys, zh: "05:40，你送出結論。EE 的大熊抱著一個新的 focus ring 趕到 ETCH-07。", en: "05:40. You send in your conclusion. Bear from EE hurries over to ETCH-07 with a new focus ring." }
    - effect: { time: "05:40", suit: true, flag: c2_bear_here, warp: { map: M03, x: 26, y: 7, dir: up } }
    - line: { id: rc_solved-2, speaker: bear, zh: "你就是那個 PE？機台沒問題，是你們製程的問題。", en: "You're the PE? The tool's fine. It's your process." }
    - line: { id: rc_solved-3, speaker: sys, zh: "大熊打開 PM-B 的耗材頁。Focus ring：1,180 / 1,200 h。", en: "Bear opens PM-B's Consumables page. Focus ring: 1,180 / 1,200 h." }
    - line: { id: rc_solved-4, speaker: bear, zh: "……好啦，這個算我們的。PM 上禮拜被生管延了。", en: "…Fine, that one's on us. Production control pushed the PM back last week." }
    - effect: { etch: fixed }
    - line: { id: rc_solved-5, speaker: sys, zh: "破真空、拆舊環、裝新環、抽真空、seasoning。PM-B 跑 monitor wafer：CD 45.1 nm，回到 target。", en: "Vent, pull the old ring, fit the new one, pump down, season. PM-B runs a monitor wafer: CD 45.1 nm, back on target." }
    - line: { id: rc_solved-6, speaker: bear, zh: "不錯嘛，菜鳥。下次直接打給我，比開單快。", en: "Not bad, rookie. Next time call me directly. It's faster than a ticket." }
    - effect: { sanity: 5, rel: { bear: 10 } }
    - line: { id: rc_solved-7, speaker: sys, zh: "Hold 的 4 批 lot 重新量測後放行。（理智 +5）", en: "The 4 held lots were re-measured and released. (Sanity +5)" }
    - line: { id: rc_solved-8, speaker: sys, zh: "CASE 03 完成！用到線索 {clues}/5，剩下咖啡 {coffee} 杯。", en: "CASE 03 complete! Clues used: {clues}/5. Coffee left: {coffee}." }
    - goto: c2_back_office

  # 過場之後：07:40 回辦公室，等 8 點晨會（走進會議室就開始）。
  c2_back_office:
    - effect: { time: "07:40", suit: false, flag: c2_standup_call, warp: { map: M03, x: 3, y: 4, dir: up } }
    - line: { id: c2_back_office-1, speaker: sys, zh: "07:40，你換下無塵衣，回到辦公室。", en: "07:40. You change out of the bunny suit and head back to the office." }
    - line: { id: c2_back_office-2, speaker: boss, zh: "（LINE）收到。8 點晨會我來報，你也進來。", en: "(LINE) Got it. I'll present at the 8 o'clock stand-up. You come in too." }
    - line: { id: c2_back_office-3, speaker: sys, zh: "晨會在會議室（沿著走廊往下）。陳處長也會來。進去之前，可以先翻翻證據簿（J）。", en: "The stand-up is in the meeting room, down the corridor. Director Chen will be there too. You might want to look over your Evidence Log (J) first." }

  # 過場之後還站在 ETCH-07 旁的大熊。
  c2_bear:
    - line: { id: c2_bear-1, speaker: bear, zh: "PM-B 還在 seasoning，別碰。", en: "PM-B is still seasoning. Don't touch it." }
    - line: { id: c2_bear-2, speaker: bear, zh: "你去睡一下吧，你看起來比機台還慘。", en: "Go get some sleep. You look worse than the tool did." }

  # C2-03：拿到 SPC 線索後，你在 LINE 回報王經理（證據 E-C2-01、E-C2-02）。
  c2_report_spc:
    - evidence: { id: E-C2-01, time: "03:05", source: chat, speaker: me, zh: "N9K417.1 OOC，正在查 ETCH-07 PM-B。", en: "N9K417.1 OOC, checking ETCH-07 PM-B." }
    - line: { id: c2_report_spc-1, speaker: me, zh: "（LINE 給王經理）N9K417.1 OOC，正在查 ETCH-07 PM-B。", en: "(LINE to Manager Wang) N9K417.1 OOC, checking ETCH-07 PM-B." }
    - evidence: { id: E-C2-02, time: "03:40", source: chat, speaker: boss, zh: "你自己看著辦，8 點前要有結論。", en: "Handle it yourself. I need a conclusion by 8." }
    - line: { id: c2_report_spc-2, speaker: boss, zh: "（LINE）你自己看著辦，8 點前要有結論。", en: "(LINE) Handle it yourself. I need a conclusion by 8." }
    - effect: { flag: seen_c2_report_spc }

  # C2-06：拿到 focus ring 線索後，你在 LINE 回報王經理（證據 E-C2-03、E-C2-04）。
  c2_report_ring:
