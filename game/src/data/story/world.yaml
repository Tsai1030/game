# 地圖上的門和物件用到的劇情（鎖門的原因、查看物件）。
scenes:
  p_gate_locked:
    - line: { id: p_gate_locked-1, speaker: sys, zh: "閘門沒反應。要先到警衛那裡換臨時通行證。", en: "The gate doesn't budge. You need a temporary badge from the guard first." }
  p_orient_locked:
    - line: { id: p_orient_locked-1, speaker: sys, zh: "新訓還沒結束。Amy 看了你一眼。", en: "Orientation isn't over yet. Amy gives you a look." }
  home_locked:
    - line: { id: home_locked-1, speaker: me, zh: "還不能走。", en: "I can't leave yet." }
  room_locked:
    - line: { id: room_locked-1, speaker: me, zh: "很晚了，先睡吧。", en: "It's late. I should get some sleep." }
  say_mes:
    - line: { id: say_mes-1, speaker: sys, zh: "MES 終端機。一整排 lot，有幾批標著 HOLD。", en: "The MES terminal. A long list of lots, a few of them marked HOLD." }
  say_room_desk:
    - line: { id: say_room_desk-1, speaker: me, zh: "筆電還開著，新人手冊攤在旁邊，一頁都還沒看。", en: "The laptop is still on. The new-hire handbook lies open next to it, unread." }
  # NPC 的基本對話；序章依劇情進度另外指定（prologue.yaml）。
  fang:
    - if: { chapter: prologue }
      then:
        - line: { id: fang-1, speaker: fang, zh: "新來的喔？有不懂的來問我，我做給你看。", en: "New here? If you don't get something, ask me. I'll show you." }
      else:
        - line: { id: fang-2, speaker: fang, zh: "夜班喔？ETCH-07 那台今天叫好幾次了，你小心點。", en: "Night shift, huh? ETCH-07 has been alarming all night. Watch yourself." }
  guard:
    - line: { id: guard-1, speaker: guard, zh: "通行證要一直掛在身上，進出都要刷。", en: "Keep your badge on you at all times. Tap it every time you go in or out." }
  amy:
    - line: { id: amy-1, speaker: amy, zh: "影片還有三支喔，先坐好。", en: "Three more videos to go. Have a seat." }
  # 序章：自己的座位、無塵衣置物櫃。
  p_pc:
    - line: { id: p_pc-1, speaker: sys, zh: "螢幕在，主機不在。桌上貼著一張便利貼：「帳號申請中，約 3 個工作天。」", en: "There's a monitor but no computer. A sticky note on the desk: “Account requested. About 3 working days.”" }
    - line: { id: p_pc-2, speaker: me, zh: "……那我今天要做什麼？", en: "…So what am I supposed to do today?" }
    - effect: { flag: p_s3_desk }
  p_locker:
    - line: { id: p_locker-1, speaker: sys, zh: "無塵衣要等安全訓練和門禁開通才能領。新人今天還進不了 Fab。", en: "You can't get a cleanroom suit until your safety training and access card come through. New hires can't enter the fab yet." }
