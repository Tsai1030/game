<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fab 夜班</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="title"><b data-i18n="app.title"></b><small data-i18n="app.subtitle"></small></div>
        <div class="stats">
          <div class="stat"><span class="lbl" data-i18n="hud.location"></span><b id="loc"></b></div>
          <div class="stat"><span class="lbl" id="date"></span><b class="num" id="clock"></b></div>
          <div class="stat warn" id="shift-stat"><span class="lbl" data-i18n="hud.shiftEnd"></span><b class="num" id="countdown"></b></div>
          <div class="stat"><span class="lbl" data-i18n="hud.coffee"></span><span class="cups" id="cups"></span></div>
          <div class="stat"><span class="lbl" data-i18n="hud.sanity"></span><span class="sanity" id="sanity" role="img"><i id="sanity-bar"></i></span><b class="num" id="sanity-n"></b></div>
          <button class="stat" id="clue-btn"><span class="lbl" data-i18n="hud.clues"></span><b class="num" id="clue-n"></b></button>
          <button class="stat" id="ev-btn" hidden><span class="lbl" data-i18n="hud.evidence"></span><b class="num" id="ev-n"></b></button>
          <button class="stat" id="codex-btn"><span class="lbl" data-i18n="hud.codex"></span><b class="num" id="codex-n"></b></button>
          <button class="stat" id="set-btn"><span class="lbl" data-i18n="hud.settings"></span></button>
        </div>
      </header>

      <div class="stage" id="stage">
        <div class="quest" id="quest">
          <button id="q-tog" aria-expanded="true" data-i18n-aria="quest.toggle">
            <span class="lbl" data-i18n="quest.case"></span><span data-i18n="quest.title"></span><span class="tog" id="q-sign">−</span>
          </button>
          <ol id="q-list"></ol>
        </div>
        <button class="prompt" id="prompt" hidden></button>
        <div class="fade" id="fade" hidden></div>
        <div class="dialog" id="dialog" hidden>
          <canvas class="portrait" id="dlg-por" width="16" height="16" aria-hidden="true"></canvas>
          <div class="dlg-main">
            <b id="dlg-who"></b><p id="dlg-text"></p>
            <div class="dlg-choices" id="dlg-choices" hidden></div>
            <div class="dlg-pick" id="dlg-pick" hidden></div>
          </div>
          <div class="dlg-tools">
            <button class="dlg-btn" id="dlg-rec" hidden>?</button>
            <button class="dlg-btn" id="dlg-note"></button>
          </div>
          <span class="dlg-next" aria-hidden="true">▼</span>
        </div>
        <div class="card" id="card" role="dialog" aria-modal="true" hidden></div>
        <div class="shower" id="shower" hidden>
          <div class="jets"></div>
          <b data-i18n="shower.title"></b><small data-i18n="shower.sub"></small>
        </div>
      </div>

      <div class="controls">
        <p class="hint" data-i18n="hint.controls"></p>
        <div class="pad" data-i18n-aria="pad.label">
          <div class="dpad">
            <button data-dir="up" data-i18n-aria="pad.up">▲</button>
            <button data-dir="left" data-i18n-aria="pad.left">◀</button>
            <button data-dir="right" data-i18n-aria="pad.right">▶</button>
            <button data-dir="down" data-i18n-aria="pad.down">▼</button>
          </div>
          <button class="abtn" id="abtn" data-i18n-aria="pad.a">A</button>
        </div>
      </div>
    </div>

    <div class="back" id="back" hidden><div class="win" id="win" role="dialog" aria-modal="true"></div></div>
    <div class="title-screen" id="title" hidden></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="banner" aria-live="polite" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
