<title>Fab 夜班 RPG 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: 全黑底像素 RPG。精簡 HUD 一列 → 盡量放大的遊戲畫面（任務框、互動提示、對話框疊在上面）→ 一行操作說明＋觸控方向鍵。
   機台畫面以黑底白框像素視窗彈出，FDC 終端機維持琥珀色。刻意只做深色。 */
:root{
  --bg:#050507; --panel:#0e0d14; --panel2:#1a1825; --edge:#e8e3f3; --edge2:#3f3a55; --ink:#f1ecfa; --muted:#9b94b2;
  --accent:#5fd0c4; --accent-ink:#06060a; --ok:#7ccf5c; --warn:#f2b544; --bad:#ff5e57; --hover:#2a2640;
  --c1:#4f9a44; --c2:#a9b84a; --c3:#e79a2a; --c4:#f05246; --scrim:rgba(0,0,0,.78); --mist:rgba(210,225,255,.2);
  --crt-bg:#110b04; --crt:#ffb43c; --crt2:#c88a2e; --crt3:#4f3512; --crt-hot:#ffe2a3; --crt-red:#ff5b3d; --crt-redbg:#3b1006; --crt-warnbg:#2b1c06;
  --f-px:"DotGothic16","Noto Sans TC",sans-serif;
  --f-lbl:"Silkscreen","DotGothic16",monospace;
  --f-crt:"IBM Plex Mono","Noto Sans TC",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-px);padding-block:10px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1800px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lbl{font:700 11px/1 var(--f-lbl);letter-spacing:.06em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
kbd{font:700 11px/1 var(--f-lbl);background:var(--edge);color:var(--accent-ink);padding:3px 6px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.title b{font:30px/1 var(--f-px);letter-spacing:.04em;text-shadow:3px 3px 0 var(--edge2)}
.title small{color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.stat{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--edge2);padding:4px 12px;min-height:40px}
.stat .lbl{color:var(--muted)}
.stat b{font-weight:400;font-size:17px}
.stat.warn b{color:var(--warn)}
button.stat{cursor:pointer;border-color:var(--edge);box-shadow:3px 3px 0 var(--edge2)}
button.stat:hover{background:var(--hover)}
button.stat:active{transform:translate(3px,3px);box-shadow:none}
.cups{display:flex;gap:3px}
.cups i{width:10px;height:13px;background:var(--c3);border:2px solid var(--edge)}
.cups i.e{background:transparent;border-color:var(--edge2)}

/* 遊戲畫面 */
.stage{position:relative;background:var(--bg);border:3px solid var(--edge2);display:flex;justify-content:center;overflow:hidden}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation;outline:none}
.quest{position:absolute;top:10px;left:10px;width:min(330px,calc(100% - 20px));background:var(--panel);border:3px solid var(--edge);font-size:14px}
.quest button{display:flex;gap:8px;align-items:center;width:100%;background:var(--edge);color:var(--accent-ink);border:0;padding:6px 10px;cursor:pointer;text-align:left}
.quest .tog{margin-left:auto}
.quest ol{list-style:none;margin:0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:4px}
.quest li{display:flex;gap:8px;align-items:center}
.quest li i{width:11px;height:11px;border:2px solid var(--edge);flex:none}
.quest li.done{color:var(--muted);text-decoration:line-through}
.quest li.done i{background:var(--ok);border-color:var(--ok)}
.quest.min ol{display:none}
.prompt{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);color:var(--ink);border:3px solid var(--edge);padding:8px 16px;font-size:16px;cursor:pointer;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;animation:bob 1s steps(2) infinite}
.prompt kbd{margin-right:10px}
@keyframes bob{50%{transform:translate(-50%,-3px)}}
.dialog{position:absolute;left:12px;right:12px;bottom:12px;max-width:1100px;margin-inline:auto;display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--edge2);padding:14px 18px 18px;cursor:pointer;min-height:116px}
.portrait{width:76px;height:76px;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--edge);background:var(--panel2)}
.dialog b{font-weight:400;color:var(--accent);font-size:15px}
.dialog p{margin:4px 0 0;font-size:19px;line-height:1.5;min-height:3em}
.dlg-next{position:absolute;right:14px;bottom:6px;animation:blink 1s steps(2) infinite}
.shower{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--mist);overflow:hidden}
.shower b,.shower small{position:relative;background:var(--panel);border:3px solid var(--edge);padding:6px 16px}
.shower b{font-weight:400;font-size:28px}
.jets{position:absolute;inset:0;background-image:radial-gradient(var(--edge) 1.5px,transparent 2px);background-size:24px 18px;opacity:.35;animation:jet .25s linear infinite}
@keyframes jet{to{background-position:24px 0}}
@keyframes blink{50%{opacity:.15}}

.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:2;text-align:center}
.pad{display:none;gap:22px;align-items:center}
@media (pointer:coarse),(max-width:720px){.pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);grid-template-areas:". u ." "l . r" ". d ."}
.dpad button,.abtn{background:var(--panel);color:var(--ink);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge2);font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.dpad button:active,.abtn:active{transform:translate(3px,3px);box-shadow:none}
.dpad [data-dir="up"]{grid-area:u}.dpad [data-dir="left"]{grid-area:l}.dpad [data-dir="right"]{grid-area:r}.dpad [data-dir="down"]{grid-area:d}
.abtn{width:70px;height:70px;background:var(--accent);color:var(--accent-ink);font:700 20px var(--f-lbl)}

/* 機台視窗 */
.back{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.win{width:min(1000px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--edge2);display:flex;flex-direction:column}
.win-h{display:flex;align-items:center;gap:10px;background:var(--edge);color:var(--accent-ink);padding:8px 10px 8px 16px;position:sticky;top:0;z-index:2}
.win-h b{font-weight:400;font-size:20px}
.x{margin-left:auto;background:var(--panel);color:var(--ink);border:0;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
.chip{font:700 11px/1 var(--f-lbl);padding:4px 6px;background:var(--ok);color:var(--accent-ink);border:2px solid var(--accent-ink)}
.chip.bad{background:var(--bad)} .chip.warn{background:var(--warn)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px 0}
.tabs button{background:var(--panel2);border:3px solid var(--edge2);padding:5px 14px;cursor:pointer}
.tabs button:hover{border-color:var(--edge)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.win-b{padding:14px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.win-f{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;padding:4px 18px 20px}
.win .hint2{margin:0;font-size:15px;color:var(--muted)}
.win .hint2 b{font-weight:400;color:var(--accent-ink);background:var(--warn);padding:0 4px}
.note{margin:0;font-size:14px;color:var(--muted)}
.pbtn{background:var(--panel2);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge2);padding:8px 18px;cursor:pointer;min-height:42px}
.pbtn:hover{background:var(--hover)}
.pbtn:active{transform:translate(4px,4px);box-shadow:none}
.pbtn.primary{background:var(--accent);color:var(--accent-ink)}
.pbtn.danger{background:var(--bad);color:var(--accent-ink)}

/* SPC */
.chart-wrap{overflow-x:auto;background:var(--panel2);border:3px solid var(--edge2);padding:6px}
.chart-wrap svg{display:block;width:100%;min-width:520px;height:auto;shape-rendering:crispEdges}
svg text{font-family:var(--f-px);font-size:13px;fill:var(--muted)}
.g{stroke:var(--edge2);stroke-width:2;stroke-dasharray:2 4}
.lim{stroke:var(--bad);stroke-width:2;stroke-dasharray:8 4}
.tgt{stroke:var(--ok);stroke-width:2}
svg .lim-t{fill:var(--bad)} svg .tgt-t{fill:var(--ok)}
.pl{fill:none;stroke:var(--ink);stroke-width:2}
.pt{stroke:var(--edge);stroke-width:2;fill:var(--panel);cursor:pointer}
.pt.b{fill:var(--accent)} .pt.ooc{fill:var(--bad)}
.pt:hover{stroke:var(--warn);stroke-width:4}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border:2px solid var(--edge);margin-right:5px;vertical-align:-1px;background:var(--panel)}
.legend .lb{background:var(--accent)} .legend .lo{background:var(--bad)}
.readout{min-height:1.5em;font-size:15px;text-align:center}

/* 表格 */
.tbl-wrap{overflow-x:auto;border:3px solid var(--edge2)}
.tbl{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th{font:700 11px var(--f-lbl);letter-spacing:.05em;text-transform:uppercase;text-align:left;background:var(--edge2);color:var(--ink);padding:7px 10px;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:2px dotted var(--edge2);white-space:nowrap}
.tbl .n{text-align:right}
.tbl tr.ooc td{color:var(--bad)} .tbl tr.warn td{color:var(--warn)}

/* 結論 */
.rc p{margin:0;line-height:2.5;font-size:17px}
.rc select{background:var(--panel2);border:3px solid var(--edge);padding:3px 6px;max-width:100%}
.evi{font-size:15px} .evi b{font-weight:400;font-size:19px;color:var(--accent)}
.big{margin:0;font-size:18px}

/* 機台狀態 */
.cluster{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:". b c ." "a tm tm d" "ef ef ef ef" "l1 l2 l3 ."}
.cluster>div{border:3px solid var(--edge2);padding:8px 10px;background:var(--panel2);font-size:15px;min-width:0;overflow-wrap:anywhere}
.cluster small{display:block;font-size:12px;color:var(--muted)}
.cluster .a{grid-area:a}.cluster .b{grid-area:b}.cluster .c{grid-area:c}.cluster .d{grid-area:d}.cluster .tm{grid-area:tm;text-align:center}.cluster .ef{grid-area:ef;text-align:center}.cluster .l1{grid-area:l1}.cluster .l2{grid-area:l2}.cluster .l3{grid-area:l3}
.pm.run{box-shadow:inset 6px 0 0 var(--ok)} .pm.idle{box-shadow:inset 6px 0 0 var(--muted)}
.pm.alarm{background:var(--bad);color:var(--accent-ink);border-color:var(--bad);animation:blink 1.2s steps(2) infinite} .pm.alarm small{color:inherit}
.pm.inh{background:var(--warn);color:var(--accent-ink);border-color:var(--warn)} .pm.inh small{color:inherit}
.alist{list-style:none;margin:0;padding:10px 12px;border:3px solid var(--edge2);background:var(--panel2);font-size:14px;display:flex;flex-direction:column;gap:3px}
.alist .bad{color:var(--bad)} .alist .warn{color:var(--warn)} .alist .ok{color:var(--ok)}

/* FDC 終端機（固定琥珀色） */
.crt{background:var(--crt-bg);color:var(--crt);font:14px/1.6 var(--f-crt);border:3px solid var(--edge2);padding:12px;position:relative;text-shadow:0 0 5px rgba(255,170,50,.4)}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.25) 2px 3px)}
.crt-grep{display:flex;gap:1ch;align-items:center;color:var(--crt2);margin-bottom:6px}
.crt-grep input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--crt3);color:var(--crt);caret-color:var(--crt-hot);text-shadow:inherit;padding:2px 0}
.crt-grep input::placeholder{color:var(--crt3)}
.crt-log{max-height:360px;overflow:auto}
.crt .ln{white-space:pre;padding:1px 4px;cursor:pointer;width:max-content;min-width:100%}
.crt .ln:hover{background:var(--crt3)}
.crt .ln.warn{background:var(--crt-warnbg);color:var(--crt-hot)}
.crt .ln.alarm{background:var(--crt-redbg);color:var(--crt-red)}
.crt .ln.pick{outline:1px dashed var(--crt-hot);outline-offset:-1px}
.crt .t{color:var(--crt2)}
.crt mark{background:var(--crt);color:var(--crt-bg);text-shadow:none}

/* 耗材 */
.cons{display:flex;flex-direction:column;gap:8px}
.con{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;background:var(--panel2);border:3px solid var(--edge2);padding:8px 12px;cursor:pointer}
.con:hover{border-color:var(--edge);background:var(--hover)}
.con b{font-weight:400}
.con .bar{grid-column:1/-1;height:12px;border:2px solid var(--edge2);background:var(--panel)}
.con .bar i{display:block;height:100%;background:var(--ok)}
.con.mid .bar i{background:var(--warn)} .con.hi .bar i{background:var(--bad)} .con.hi .num{color:var(--bad)}

/* Wafer map */
.wbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.wmap{width:100%;max-width:360px;aspect-ratio:1;display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);gap:1px}
.d{border:0;padding:0;margin:0;min-width:0;min-height:0}
.d.v{visibility:hidden} .d.rim{background:var(--muted)}
.d.k1{background:var(--c1)} .d.k2{background:var(--c2)} .d.k3{background:var(--c3)} .d.k4{background:var(--c4)}
button.d{cursor:crosshair} button.d:hover{background:var(--edge)}
.scale{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);justify-content:center}
.scale i{display:inline-block;width:11px;height:11px;border:2px solid var(--edge2);margin-right:4px;vertical-align:-1px}

/* 其他 */
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0;padding:12px 14px;border:3px solid var(--edge2);background:var(--panel2)}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.cluelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cluelist li{border:3px dashed var(--edge2);padding:10px 14px;color:var(--muted)}
.cluelist li.got{border-style:solid;border-color:var(--edge);background:var(--panel2);color:var(--ink)}
.cluelist b{font-weight:400;display:block;font-size:17px}
.cluelist small{font-size:13px;color:var(--muted)}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));max-width:min(600px,calc(100% - 32px));background:var(--panel);color:var(--ink);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--edge2);padding:12px 18px;z-index:40;font-size:16px}
#toast::before{content:"▶ ";color:var(--accent)}
#toast[data-kind="bad"]{border-color:var(--bad)}
#toast[data-kind="bad"]::before{color:var(--bad)}
#toast[data-kind="clue"]{background:var(--warn);color:var(--accent-ink);border-color:var(--warn)}
#toast[data-kind="clue"]::before{content:"✎ ";color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.prompt,.dlg-next,.jets,.pm.alarm{animation:none}}
</style>

<div class="app">
  <header class="hud">
    <div class="title"><b>Fab 夜班</b><small>曦晶半導體 Fab 9 · 製程工程師值班中</small></div>
    <div class="stats">
      <div class="stat"><span class="lbl">位置</span><b id="loc">辦公室</b></div>
      <div class="stat"><span class="lbl">10/21</span><b class="num" id="clock">02:47:00</b></div>
      <div class="stat warn"><span class="lbl">交班</span><b class="num" id="countdown">05:13:00</b></div>
      <div class="stat"><span class="lbl">咖啡</span><span class="cups" id="cups" aria-label="咖啡"></span></div>
      <button class="stat" id="clue-btn"><span class="lbl">線索簿</span><b class="num" id="clue-n">0/5</b></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" tabindex="0" aria-label="Fab 夜班遊戲畫面：俯視的辦公室、更衣室與晶圓廠"></canvas>
    <div class="quest" id="quest">
      <button id="q-tog" aria-expanded="true"><span class="lbl">Case 03</span><span>ETCH 段 CD 偏移</span><span class="tog" id="q-sign">−</span></button>
      <ol id="q-list"></ol>
    </div>
    <button class="prompt" id="prompt" hidden></button>
    <div class="dialog" id="dialog" hidden>
      <canvas class="portrait" id="dlg-por" width="16" height="16" aria-hidden="true"></canvas>
      <div><b id="dlg-who"></b><p id="dlg-text"></p></div>
      <span class="dlg-next" aria-hidden="true">▼</span>
    </div>
    <div class="shower" id="shower" hidden><div class="jets"></div><b>風淋中…</b><small>站好、張開雙臂、轉一圈</small></div>
  </div>

  <div class="controls">
    <p class="hint"><kbd>方向鍵</kbd> / <kbd>WASD</kbd> 走路 · 點地板自動走過去 · 點機台或人會走過去互動 · <kbd>E</kbd> / <kbd>空白鍵</kbd> 互動 · <kbd>Esc</kbd> 關閉視窗 · 先點一下畫面，鍵盤才有反應</p>
    <div class="pad" aria-label="觸控操作">
      <div class="dpad"><button data-dir="up" aria-label="上">▲</button><button data-dir="left" aria-label="左">◀</button><button data-dir="right" aria-label="右">▶</button><button data-dir="down" aria-label="下">▼</button></div>
      <button class="abtn" id="abtn" aria-label="互動">A</button>
    </div>
  </div>
</div>

<div class="back" id="back" hidden><div class="win" id="win" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ===== 案件資料 ===== */
const SPC=[["N9K385.1","A",45.1],["N9K386.1","B",44.8],["N9K387.1","A",45.3],["N9K388.1","B",45.0],["N9K389.1","A",44.7],["N9K390.1","B",45.2],["N9K391.1","A",45.0],["N9K392.1","B",45.1],["N9K393.1","A",44.6],["N9K395.1","B",45.4],["N9K396.1","A",45.2],["N9K398.1","B",45.3],["N9K399.1","A",44.9],["N9K401.1","B",45.6],["N9K402.1","A",45.0],["N9K404.1","B",45.8],["N9K405.1","A",45.2],["N9K407.1","B",45.9],["N9K408.1","A",44.8],["N9K410.1","B",46.2],["N9K411.1","A",45.1],["N9K412.1","B",46.8],["N9K415.1","B",47.1],["N9K416.1","A",45.1],["N9K417.1","B",47.4]];
const LOTS=[
  {id:"N9K417.1",tool:"ETCH-07",ch:"PM-B",cd:47.4,j:"ooc",st:"HOLD"},
  {id:"N9K416.1",tool:"ETCH-07",ch:"PM-A",cd:45.1,j:"ok",st:"RUN"},
  {id:"N9K415.1",tool:"ETCH-07",ch:"PM-B",cd:47.1,j:"ooc",st:"HOLD"},
  {id:"N9K412.1",tool:"ETCH-07",ch:"PM-B",cd:46.8,j:"ooc",st:"HOLD"},
  {id:"N9K410.1",tool:"ETCH-07",ch:"PM-B",cd:46.2,j:"warn",st:"HOLD"},

/* ===== 移動與尋路 ===== */
const FLOOR=".,y=D";
const inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
function walk(x,y,suit){if(!inb(x,y))return false;const ch=T[y][x];if(ch==="A"){if(!suit)return false}else if(!FLOOR.includes(ch))return false;return !BLK[y][x]}
const objAt=(x,y)=>inb(x,y)?BLK[y][x]:null;
function adj(o,x,y){return (x>=o.x&&x<o.x+o.w&&(y===o.y-1||y===o.y+o.h))||(y>=o.y&&y<o.y+o.h&&(x===o.x-1||x===o.x+o.w))}
function bfs(sx,sy,goal,suit){
  if(goal(sx,sy))return [];
  const prev=new Int32Array(MW*MH).fill(-2),s0=sy*MW+sx,q=[s0];prev[s0]=-1;let h=0;
  while(h<q.length){const k=q[h++],x=k%MW,y=(k/MW)|0;
    for(const v of [[0,-1],[0,1],[-1,0],[1,0]]){const nx=x+v[0],ny=y+v[1];if(!walk(nx,ny,suit))continue;const nk=ny*MW+nx;if(prev[nk]!==-2)continue;prev[nk]=k;
      if(goal(nx,ny)){const p=[];let cc=nk;while(cc!==s0){p.push({x:cc%MW,y:(cc/MW)|0});cc=prev[cc]}return p.reverse()}
      q.push(nk)}}
  return null;
}
let lastWarn=0;

function tryMove(d){
  S.dir=d;const v=DIRS[d],nx=S.x+v[0],ny=S.y+v[1];
  if(inb(nx,ny)&&T[ny][nx]==="A"&&!S.suit){warnSuit();return false}
  if(!walk(nx,ny,S.suit))return false;
  step={fx:S.x,fy:S.y,tx:nx,ty:ny,t:0};return true;
}

  if(!step&&!busy()){

    if(d){path=[];pending=null;marker=null;tryMove(d)}

      const n=path.shift(),dx=n.x-S.x,dy=n.y-S.y;
      const dd=Math.abs(dx)+Math.abs(dy)!==1?null:dx===1?"right":dx===-1?"left":dy===1?"down":"up";
      if(!dd||!tryMove(dd)){path=[];pending=null}
      if(!path.length)marker=null;
    }else if(pending){const o=pending;pending=null;if(adj(o,S.x,S.y))doInteract(o)}
  }

  else{S.px=S.x*TS;S.py=S.y*TS}

/* MET-02 */
function drawWafer(){
  const r=rng(1027),N=21,Cc=10,RAD=9.2;let h="";
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const dx=i-Cc,dy=j-Cc,d=Math.hypot(dx,dy);
    if(d>RAD){const rim=d<=RAD+1.25&&!(dx===0&&dy>9);h+=`<span class="d ${rim?"rim":"v"}"></span>`;continue}
    let cd=45+(r()-.5)*.6;const e=d/RAD;
    if(e>.72)cd+=(e-.72)/.28*2.7*(.75+r()*.5);
    if(r()<.015)cd+=1.6;
    const k=cd>46.5?4:cd>46?3:cd>45.5?2:1;
    h+=`<button class="d k${k}" data-x="${dx}" data-y="${-dy}" data-cd="${cd.toFixed(1)}" data-r="${d.toFixed(1)}" aria-label="die ${dx},${-dy}"></button>`;
  }
  const m=$("#wmap");m.innerHTML=h;
  const rd=d=>{const cd=+d.dataset.cd;$("#w-read").textContent=`Die (${d.dataset.x}, ${d.dataset.y})　CD ${cd.toFixed(1)} nm　${cd>46.5?"OOS":cd>46?"偏高":"PASS"}`};
  m.addEventListener("pointerover",e=>{const d=e.target.closest("button.d");if(d)rd(d)});
  m.addEventListener("click",e=>{const d=e.target.closest("button.d");if(!d)return;rd(d);const cd=+d.dataset.cd,rr=+d.dataset.r;
    if(cd>46.5&&rr>7)addClue("map");else if(cd>46.5)toast("這顆在中間，比較像隨機 particle，不是 pattern。");else toast("這顆正常。")});
}
